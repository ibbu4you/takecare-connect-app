# Codemagic build for the iOS App Store.
#
# Two things have to exist in the Codemagic UI before this runs, because
# neither can live in the repository:
#
#   1. An App Store Connect API key, under Settings > Integrations > Apple
#      Developer Portal. The one this references is named "App Store Connect"
#      (key 4H38UR86J6) and holds Admin, which `--create` below needs. The name
#      is matched literally: rename it in Codemagic and this stops resolving.
#   2. A variable group `appstore_signing` containing CERTIFICATE_PRIVATE_KEY,
#      marked secure — an RSA private key in PEM form. The certificate this
#      account already had was created elsewhere and its private key never left
#      that machine, so it cannot sign here and Apple cannot re-issue the key.
#      This one exists so a certificate can be created that this build owns
#      both halves of.
#
# The Android half is deliberately not here. Release signing for Play is wired
# to a keystore that is gitignored, so a Play workflow needs the keystore
# uploaded to Codemagic as a secure file first.
workflows:
  ios-app-store:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "App Store Connect"

    environment:
      groups:
        # Holds CERTIFICATE_PRIVATE_KEY, an RSA key added as a secure variable
        # in the Codemagic UI. See the note at the top of this file.
        - appstore_signing

      # Pinned, not `stable`. A newer Flutter migrates the Xcode project mid
      # build — deployment target 13 to 15, Swift Package Manager integration,
      # a rewritten Podfile — and those migrations land in project.pbxproj
      # after signing has been written into it. Matching the version the app is
      # developed and tested against keeps CI building what was tested.
      flutter: 3.44.0
      xcode: latest
      cocoapods: default
      vars:
        # The Apple ID of the app record, from the App Store Connect URL.
        APP_STORE_APPLE_ID: 6803486367
        BUNDLE_ID: org.takecareinternational.takecareConnect

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Fetch packages
        script: flutter pub get

      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Prepare the Xcode project
        # `--config-only` runs everything `flutter build ipa` does to the
        # project — the migrations above, the generated xcconfigs — and stops
        # before compiling. Doing it here means `use-profiles` writes signing
        # into a project that is already in its final shape, instead of having
        # its work overwritten by a migration that runs later.
        #
        # `--no-codesign` because this runs before the certificate exists, and
        # `--config-only` still performs Flutter's signing check without it.
        script: flutter build ios --config-only --release --no-codesign

      - name: Set up code signing
        # Done as a script rather than through the `ios_signing` environment
        # block, because that block only *fetches* profiles that already exist
        # and this account had never had an App Store profile for the bundle
        # id — the first build failed with "No matching profiles found".
        #
        # `--create` makes the distribution certificate and the provisioning
        # profile if the portal has neither, which needs the API key to hold
        # App Manager. It is idempotent: later builds reuse what this made.
        #
        # `use-profiles` then rewrites the Xcode project, which is set to
        # CODE_SIGN_STYLE = Automatic. Automatic signing needs an Xcode signed
        # into an account, and a CI machine has none.
        script: |
          keychain initialize

          # `--certificate-key` is what makes `--create` possible.
          #
          # This account already holds a distribution certificate, but its
          # private key stayed on the machine that made it, so it cannot sign
          # here — a certificate on its own is only the public half. Apple has
          # no way to hand the private half back, and `--create` could not make
          # a replacement because building a signing request needs a key too.
          #
          # Supplying one settles both: the fetch creates a certificate bound
          # to this key on the first run and reuses it afterwards, so builds do
          # not accumulate certificates against Apple's per-account limit.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

          keychain add-certificates
          xcode-project use-profiles

          echo "--- signing identities available to the build ---"
          security find-identity -v -p codesigning

          # Both locations. The CLI saves under Xcode's UserData directory;
          # MobileDevice is where Xcode itself puts them. Checking only the
          # latter failed a build whose signing had entirely succeeded.
          echo "--- provisioning profiles installed ---"
          ls -la ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ 2>/dev/null || true
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || true

          # No assertion on the profile directory here.
          #
          # Two builds that had signed perfectly were failed by one, first for
          # reading the wrong directory and then because `ls dirA/* dirB/*`
          # reports failure when either pattern matches nothing — and the
          # second directory is empty whenever the CLI, rather than Xcode,
          # installed the profile. The listing above already shows what is
          # there, and `use-profiles` says which profile it applied to which
          # target, so the guard was duplicating information that was already
          # on screen while inventing new ways to be wrong.

          if ! security find-identity -v -p codesigning | grep -q "Distribution"; then
            echo "No distribution identity in the keychain."
            echo "A certificate without its private key cannot sign."
            exit 1
          fi

      - name: Build the IPA
        # Two commands rather than `flutter build ipa`, because that command
        # will not sign this app however well signing is set up.
        #
        # Before archiving it looks for a signing identity itself, and the
        # pattern it matches wants "Develop" in the identity name — it is
        # written for development builds onto a device. The identity here is
        # "Apple Distribution: ELITE BOX PRIVATE LIMITED", which is the correct
        # certificate for the App Store and can never match, so the build stops
        # with "No development certificates available". It only takes that path
        # because the project carries no DEVELOPMENT_TEAM; Flutter tries to
        # infer the team from the keychain and rejects what it finds.
        #
        # So Flutter compiles Dart and assembles the .app unsigned, and
        # xcodebuild archives and exports it through the profile installed
        # above, which is the part that actually understands distribution
        # signing.
        #
        # The build number comes from what App Store Connect already has rather
        # than from pubspec.yaml. Apple rejects a build number it has seen
        # before, and pubspec's `+2` is committed — two builds off one commit
        # would collide. An empty answer means no build has ever been uploaded.
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          BUILD_NUMBER=$(( ${LATEST:-0} + 1 ))
          echo "--- building as build number $BUILD_NUMBER ---"

          flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER"

          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        # TestFlight only. Promoting to the store stays a manual decision in
        # App Store Connect, so a tag push can never ship to the public.
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - eliteboxindia@gmail.com
        notify:
          success: true
          failure: true
