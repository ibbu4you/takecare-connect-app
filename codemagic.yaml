# Codemagic build for the iOS App Store.
#
# Two things have to exist in the Codemagic UI before this runs, because
# neither can live in the repository:
#
#   1. An App Store Connect API key, under Settings > Integrations > Apple
#      Developer Portal. The one this references is named "App Store Connect"
#      (key 4H38UR86J6) and holds Admin, which `--create` below needs. The name
#      is matched literally: rename it in Codemagic and this stops resolving.
#   2. Nothing else. Signing certificates and profiles are fetched and applied
#      by `xcode-project use-profiles`, using that same key.
#
# The Android half is deliberately not here. Release signing for Play is wired
# to a keystore that is gitignored, so a Play workflow needs the keystore
# uploaded to Codemagic as a secure file first.
workflows:
  ios-app-store:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "App Store Connect"

    environment:
      # Pinned, not `stable`. A newer Flutter migrates the Xcode project mid
      # build — deployment target 13 to 15, Swift Package Manager integration,
      # a rewritten Podfile — and those migrations land in project.pbxproj
      # after signing has been written into it. Matching the version the app is
      # developed and tested against keeps CI building what was tested.
      flutter: 3.44.0
      xcode: latest
      cocoapods: default
      vars:
        # The Apple ID of the app record, from the App Store Connect URL.
        APP_STORE_APPLE_ID: 6803486367
        BUNDLE_ID: org.takecareinternational.takecareConnect

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Fetch packages
        script: flutter pub get

      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Prepare the Xcode project
        # `--config-only` runs everything `flutter build ipa` does to the
        # project — the migrations above, the generated xcconfigs — and stops
        # before compiling. Doing it here means `use-profiles` writes signing
        # into a project that is already in its final shape, instead of having
        # its work overwritten by a migration that runs later.
        script: flutter build ios --config-only --release

      - name: Set up code signing
        # Done as a script rather than through the `ios_signing` environment
        # block, because that block only *fetches* profiles that already exist
        # and this account had never had an App Store profile for the bundle
        # id — the first build failed with "No matching profiles found".
        #
        # `--create` makes the distribution certificate and the provisioning
        # profile if the portal has neither, which needs the API key to hold
        # App Manager. It is idempotent: later builds reuse what this made.
        #
        # `use-profiles` then rewrites the Xcode project, which is set to
        # CODE_SIGN_STYLE = Automatic. Automatic signing needs an Xcode signed
        # into an account, and a CI machine has none.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build the IPA
        # The build number is taken from what App Store Connect already has,
        # not from pubspec.yaml. Apple rejects a build whose number it has seen
        # before, and pubspec's `+2` is committed — so two builds off the same
        # commit would collide.
        script: |
          BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          flutter build ipa --release \
            --build-number=$((BUILD_NUMBER + 1)) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        # TestFlight only. Promoting to the store stays a manual decision in
        # App Store Connect, so a tag push can never ship to the public.
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - eliteboxindia@gmail.com
        notify:
          success: true
          failure: true
